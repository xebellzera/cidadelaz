<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icone.png">
<title>Conectar ao TikTok · Cidadela Z</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: documento legal com a identidade da Cidadela Z — faixa da marca, título em estêncil, seções numeradas (a numeração é a das cláusulas) */
:root {
	--bg: #eef1ea;
	--panel: #fafcf7;
	--fg: #151a12;
	--muted: #56614f;
	--line: #d2d9cb;
	--accent: #237510;
	--display: "Big Shoulders Stencil Display", "Impact", "Arial Narrow", sans-serif;
	--body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
	--mono: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) { --bg: #090c08; --panel: #11160f; --fg: #e6ecdf; --muted: #96a28b; --line: #232c1f; --accent: #6dff3d; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #090c08; --panel: #11160f; --fg: #e6ecdf; --muted: #96a28b; --line: #232c1f; --accent: #6dff3d; color-scheme: dark; }
* { box-sizing: border-box; }
body {
	background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.65;
	padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px;
}
.wrap { max-width: 760px; margin: 0 auto; }
header { padding-block: 32px 22px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.brand img { width: 48px; height: 48px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 8vw, 60px); line-height: .95; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; max-width: 65ch; }
.date { font-family: var(--mono); font-size: 13px; color: var(--muted); }
section { padding-block: 18px 4px; }
h2 { font-family: var(--body); font-weight: 600; font-size: 19px; margin: 0 0 6px; display: flex; gap: 10px; align-items: baseline; text-wrap: balance; }
h2 span { font-family: var(--mono); font-size: 13px; color: var(--accent); min-width: 2ch; }
p, ul { margin: 0 0 10px; max-width: 68ch; }
ul { padding-left: 20px; display: grid; gap: 6px; }
b { font-weight: 600; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.contact { margin-top: 26px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.contact code { font-family: var(--mono); font-size: 14px; user-select: all; }
footer { margin-top: 30px; font-size: 13px; color: var(--muted); }
</style>

<style>
.box { margin-top: 22px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 12px; }
textarea { width: 100%; min-height: 96px; resize: vertical; font-family: var(--mono); font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
button { justify-self: start; font: 600 15px var(--body); color: var(--bg); background: var(--accent); border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.ok { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
	<header>
		<div class="brand"><img src="icone.png" alt="" width="48" height="48"><span>Cidadela Z · BOT-TIKTOK</span></div>
		<h1>Conectar ao TikTok</h1>
		<p class="lead" id="lead">Copie o texto abaixo e cole no Discord com <b>/tiktok codigo</b>. Faça isso em até 5 minutos.</p>
	</header>
	<div class="box">
		<label for="url"><b>Endereço para colar no /tiktok codigo</b></label>
		<textarea id="url" readonly></textarea>
		<button type="button" id="copy">Copiar</button>
		<span id="msg" aria-live="polite"></span>
	</div>
	<footer>Esta página só mostra o código que o TikTok mandou. Nada é guardado aqui.</footer>
</div>
<script>
	const Params = new URLSearchParams(location.search);
	const Box = document.getElementById("url");
	Box.value = location.href;
	if (!Params.get("code")) {
		document.getElementById("lead").textContent = Params.get("error")
			? "O TikTok não autorizou: " + (Params.get("error_description") || Params.get("error")) + ". Gere outro link com /tiktok conectar."
			: "Esta página recebe o retorno do login do TikTok. Use /tiktok conectar no Discord para começar.";
	}
	document.getElementById("copy").addEventListener("click", () => {
		const Done = () => { document.getElementById("msg").innerHTML = '<span class="ok">Copiado! Agora cole no /tiktok codigo.</span>'; };
		Box.select();
		if (navigator.clipboard) navigator.clipboard.writeText(Box.value).then(Done, () => { document.execCommand("copy"); Done(); });
		else { document.execCommand("copy"); Done(); }
	});
</script>
</body>
</html>
